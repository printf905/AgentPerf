name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy agentperf tests scripts
      - name: Dogfood suite regression check
        run: |
          agentperf suite validate benchmarks/openai-agents-support-triage
          agentperf suite check \
            benchmarks/openai-agents-support-triage \
            examples/dogfooding/openai_agents_support_triage_compact \
            --format markdown \
            --output "$RUNNER_TEMP/agentperf-dogfood.md"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat "$RUNNER_TEMP/agentperf-dogfood.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build package
        run: python -m build
