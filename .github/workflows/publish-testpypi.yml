name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish to TestPyPI"
        required: true
        default: "0.5.0"
      confirm_target:
        description: "Type TESTPYPI to confirm this is not production PyPI"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build TestPyPI distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify TestPyPI preconditions
        env:
          INPUT_VERSION: ${{ inputs.version }}
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          if os.environ["CONFIRM_TARGET"] != "TESTPYPI":
              raise SystemExit("confirm_target must be exactly TESTPYPI")
          if os.environ["GITHUB_REF_NAME"] != "main":
              raise SystemExit("TestPyPI publication must be manually run from main")
          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          if version != os.environ["INPUT_VERSION"]:
              raise SystemExit(
                  f"workflow input version {os.environ['INPUT_VERSION']!r} "
                  f"does not match pyproject version {version!r}"
              )
          if version != "0.5.0":
              raise SystemExit(f"this TestPyPI workflow is prepared for 0.5.0, found {version!r}")
          print(f"Publishing TestPyPI candidate for {version}")
          PY
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build wheel and sdist
        run: python -m build
      - name: Validate package metadata
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: agentperf-testpypi-dist
          path: dist/*
          if-no-files-found: error

  publish-testpypi:
    name: Publish distributions to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agentperf-testpypi-dist
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
