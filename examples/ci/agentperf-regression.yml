name: AgentPerf Regression Check

on:
  pull_request:

jobs:
  agentperf-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AgentPerf
        run: pip install -e ".[dev]"

      - name: Produce candidate artifact
        run: |
          # Replace this with a deterministic local benchmark command that writes
          # a candidate AgentPerf artifact directory.
          cp -R examples/artifacts/m3_dedup_only candidate-artifact

      - name: Run AgentPerf regression check
        run: |
          agentperf check \
            examples/artifacts/m3_raw_full \
            candidate-artifact \
            --policy examples/policies/m3-context-regression.yaml \
            --format markdown \
            --output agentperf-regression.md
          cat agentperf-regression.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-agentperf-artifact
          path: candidate-artifact
