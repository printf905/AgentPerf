[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentperf"
version = "0.4.0"
description = "Cross-layer profiler for agentic LLM workloads"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "AgentPerf contributors" }]
keywords = ["agents", "observability", "profiling", "llm", "vllm", "sglang"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/printf905/AgentPerf"
Repository = "https://github.com/printf905/AgentPerf"
Issues = "https://github.com/printf905/AgentPerf/issues"
Documentation = "https://github.com/printf905/AgentPerf/blob/main/docs/GETTING_STARTED.md"
Changelog = "https://github.com/printf905/AgentPerf/blob/main/CHANGELOG.md"
Releases = "https://github.com/printf905/AgentPerf/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1",
    "twine>=5",
    "openai-agents>=0.19,<0.20",
    "langgraph>=1,<2",
]
openai-agents = ["openai-agents>=0.19,<0.20"]
mini-swe-agent = ["mini-swe-agent>=2,<3"]
langgraph = ["langgraph>=1,<2"]

[project.scripts]
agentperf = "agentperf.cli:main"

[tool.setuptools.packages.find]
include = ["agentperf*"]

[tool.setuptools.package-data]
agentperf = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
